function buildArch(fwId,d,basic){
 if(basic&&fwId==='wpf')return {title:'MVVM (View · ViewModel · Logic)',
  layers:[['View','XAML 화면 · 바인딩만',['MainWindow.xaml','MainWindow.xaml.cs (InitializeComponent만)']],['ViewModel','화면 상태·Command',['ViewModels/MainViewModel.cs','Commands/RelayCommand.cs','ViewModels/ViewModelBase.cs']],['Logic','계산·검증 — 단독 테스트 가능',[`Logic/${d.cls}.cs`]]],
  rules:['코드 비하인드(.xaml.cs)에는 InitializeComponent() 외 코드를 두지 않음','버튼은 Command, 입력값은 TwoWay 바인딩으로 연결','ViewModel은 TextBox 같은 화면 컨트롤을 직접 참조하지 않음','계산·검증은 Logic 클래스에 두고 ViewModel에서 호출']};
 if(basic){const [ui,lg]=ARCH_B[fwId](d.cls);
  return {title:'화면과 로직 분리 (2계층)',layers:[['화면','입력을 읽고 결과를 보여 주는 일만',ui],['로직','계산·검증 — 화면 없이도 테스트 가능',lg]],
   rules:['이벤트 처리 코드는 입력값을 로직 클래스에 넘기고 결과만 표시','로직 클래스는 화면 컨트롤을 직접 참조하지 않음','중급 과제의 3-tier 구조로 가기 위한 첫 단계예요']};}
 const [p,b,dt,cm]=ARCH_M[fwId](d.en);
 return {title:'3-tier 구조',layers:[['Presentation','화면 표시·입력, 사용자 이벤트',p],['Business','업무 규칙·검증·트랜잭션',b],['Data','저장·조회만 담당',dt]],common:cm,
  rules:[fwId==='react'?'컴포넌트 안에서 fetch를 직접 호출하지 않음':fwId==='wpf'?'코드 비하인드에는 InitializeComponent()만 — 로직은 ViewModel 이하, SQL은 Data 계층에만':'화면 계층에는 SQL·DB 접근 코드를 두지 않음',`"${d.mid.C}" 같은 업무 규칙은 Business 계층에 구현`,'Data 계층은 저장·조회만 담당하고, 바꿔 끼울 수 있게 분리','의존 방향은 위에서 아래로 한 방향, 계층 간에는 모델/DTO로 전달'],
  note:fwId==='react'?'React는 프론트엔드 안에서의 계층 분리예요. 실제 DB 역할은 json-server(Mock API)가 맡습니다.':null};
}
function buildDb(fwId,d){

function buildRubric(fwId,s,d,basic){
 const bonus={g:'가산점 (선택 기능)',bonus:1,items:s.opt.slice(0,4).map(t=>[t,basic?3:5])};
 if(basic)return [

  {g:'코드 구조',items:fwId==='wpf'?[['코드 비하인드에 로직 없음 (InitializeComponent만)',8],['Click 이벤트 대신 Command·바인딩 사용',7],['계산·검증이 Logic 클래스로 분리됨',5]]:[['화면 코드와 계산·검증 로직이 분리됨',10],['컨트롤·메서드 이름이 역할을 드러냄',5],['중복 없이 메서드로 나눔',5]]},
  {g:'UI·사용성',items:[['예시 화면과 같은 배치·정렬',5],['탭 이동 순서와 첫 포커스 설정',5]]},
  {g:'제출물',items:[['README에 실행 방법과 화면 캡처',5],['의미 있는 단위로 커밋',5]]},bonus];
 return [
  {g:'기능 (CRUD)',items:['R','C','U','D'].map((op,i)=>[`${OPN[op]}: ${d.crud[op][0]}`,[8,8,7,7][i]])},

  {g:'데이터 설계',items:[[fwId==='react'?'db.json 구조와 설계 이유를 README에 정리':'ERD와 설계 이유를 README에 정리',5],['필수값·중복 방지를 DB 제약으로도 반영',5],['날짜·금액 등 타입 선택이 적절함',5]]},
  {g:'예외·검증',items:s.exc.slice(0,3).map(t=>[t,5])},
  {g:'코드 품질·제출',items:[['네이밍과 메서드 길이가 적절함',5],['Business 계층 단위 테스트 2개 이상',5],['기능 단위 커밋과 PR 설명 작성',5]]},bonus];
}

 const f=FW[fwId],I=IDEAS[id],basic=I.lv==='초급',d=I.dom?{...DOM[I.dom],...I}:I,L=LAY[I.lay];

  title:d.title+(basic?'':f.suffix),team:d.team,scenario:d.scenario+' '+(basic?f.howB:f.how),
  days:estDays(fwId,I.lay,basic),learn:basic?d.learn:L.learn,
  controls:uniq(L.controls.map(c=>nm(fwId,c))),tech:basic?f.techB:['3-tier 구조',...f.techM],hints:basic?f.hintsB:null,
  app:fwId==='winform'&&d.en?`${d.app} - ${(d.en||'Tool')}Manager`:d.app,menu:f.menu,
  url:f.url?f.url(d.slug):null,nav:d.nav||[d.title,'도움말'],accent:f.accent};
 if(basic){
  s.reqs=d.reqs.map((r,i)=>({k:String(i+1),name:r.k,items:r.items}));
  s.exc=[...d.exc,f.excB];
 }else{
  const im=f.impl(d),imm=f.implMid(d),ex=I.extra||{};
  s.reqs=['R','C','U','D'].map(op=>({k:op,name:OPN[op],items:[...(ex[op]?[ex[op]]:[]),...d.crud[op],d.mid[op],im[op],imm[op]].filter(Boolean)}));
  s.exc=[...d.exc,...d.excMid,...f.exc];
 }
 s.ann=L.ann.map(([k,c,desc])=>({k,n:nm(fwId,c),d:desc}));
 s.opt=[...(d.opt||[]),...(basic?[]:(f.optM||[]))];
 s.arch=buildArch(fwId,d,basic);if(!basic)s.db=buildDb(fwId,d);s.rubric=buildRubric(fwId,s,d,basic);
 return s;
}

function spread(first,rest){ // 같은 화면 유형이 연달아 나오지 않게 배치
 const out=[first],pool=shuffle(rest);
 while(pool.length){const last=IDEAS[out[out.length-1]].lay;let i=pool.findIndex(id=>IDEAS[id].lay!==last);if(i<0)i=0;out.push(pool.splice(i,1)[0]);}
 return out;
}

         <button onClick=${()=>setAnn(!ann)} aria-pressed=${ann} className="inline-flex h-11 items-center gap-2 rounded-lg border border-gray-300 px-3 text-[13px] font-semibold hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-cobalt">
          <span className=${'relative h-5 w-9 rounded-full transition '+(ann?'bg-flame':'bg-gray-300')}><span className=${'absolute top-0.5 h-4 w-4 rounded-full bg-white shadow transition-all '+(ann?'left-[18px]':'left-0.5')}></span></span>컨트롤 이름
         </button>
         <button onClick=${()=>setZoom(!zoom)} aria-pressed=${zoom} className="h-11 rounded-lg border border-gray-300 px-3 text-[13px] font-semibold hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-cobalt">${zoom?'화면에 맞춤':'원본 크기'}</button>
        </div>
       </div>
       <div className="blueprint overflow-x-auto">
        <div className="rise p-2 sm:p-4" style=${{minWidth:zoom?'860px':'0'}}>${m.svg}</div>
       </div>
       <div className="border-t border-gray-200 px-4 py-3">
        <p className="text-[13px] text-gray-500">목록·카드·단계·탭처럼 "(클릭)"이 붙은 부분은 눌러서 바뀌는 모습을 볼 수 있어요.</p>
        ${ann?html`<ol className="mt-3 grid gap-x-5 gap-y-2 sm:grid-cols-2">${m.list.map((a,i)=>html`<li key=${i} className="flex items-start gap-2.5 text-[13px] leading-snug">
         <span className="grid h-5 w-5 flex-none place-items-center rounded-full bg-flame text-[11px] font-bold text-white">${i+1}</span>
         <span><span className="font-mono text-[12.5px] font-medium text-ink">${a.n}</span><span className="block text-gray-500">${a.d}</span></span></li>`)}</ol>`:null}
       </div>
      </div>
     </div>
    </div>
   </div>
   <p className="mt-8 border-t border-gray-100 pt-4 text-[12.5px] text-gray-500">프로토타입 샘플: 초급 ${pool('초급').length}개(화면 유형 6가지) · 중급 ${pool('중급').length}개(화면 유형 6가지) × 언어/프레임워크 5가지. 실제 버전은 Claude API가 넘긴 아이디어와 다른 화면 유형으로 매번 새 과제를 만듭니다. 회사명·인물·수치는 모두 예시입니다.</p>
  </main>
 </div>`;
}
